<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Orange Background with rounded corners for an app icon look -->
  <rect width="512" height="512" rx="112" fill="#ff5500" />

  <!-- Crosshair Lines -->
  <g stroke="#ffffff" stroke-width="32" stroke-linecap="square">
    <!-- Top Line -->
    <line x1="256" y1="128" x2="256" y2="208" />
    <!-- Bottom Line -->
    <line x1="256" y1="304" x2="256" y2="384" />
    <!-- Left Line -->
    <line x1="128" y1="256" x2="208" y2="256" />
    <!-- Right Line -->
    <line x1="304" y1="256" x2="384" y2="256" />
  </g>

  <!-- Optional Center Dot -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
</svg>
