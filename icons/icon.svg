<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Fondo naranja con esquinas redondeadas -->
  <rect width="128" height="128" rx="22" fill="#ff5500"/>

  <!-- Ring exterior -->
  <circle cx="64" cy="64" r="38" stroke="white" stroke-width="9" fill="none"/>

  <!-- Líneas de mira — N / S / E / W -->
  <line x1="64" y1="14" x2="64" y2="34" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <line x1="64" y1="94" x2="64" y2="114" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <line x1="14" y1="64" x2="34" y2="64" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <line x1="94" y1="64" x2="114" y2="64" stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Punto central -->
  <circle cx="64" cy="64" r="10" fill="white"/>
</svg>
