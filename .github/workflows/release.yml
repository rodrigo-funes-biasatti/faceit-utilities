name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> $GITHUB_OUTPUT

      - name: Build ZIP
        run: |
          zip -r faceit-utilities-v${{ steps.version.outputs.version }}.zip \
            manifest.json src/ popup/ icons/ \
            --exclude "*.DS_Store" \
            --exclude "__MACOSX/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: faceit-utilities-v${{ steps.version.outputs.version }}.zip
